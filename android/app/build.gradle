plugins { id 'com.android.application' }
def personalKeyFile = rootProject.file('../.private/default-api-key.txt')
def publicBuild = providers.gradleProperty('publicBuild').map { it.toBoolean() }.getOrElse(false)
def personalDebugKey = !publicBuild && personalKeyFile.exists() ? personalKeyFile.getText('UTF-8').trim() : ''
def javaString = { value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"').replace('\r', '').replace('\n', '') + '"' }
android {
    namespace 'local.offerin.practice'
    compileSdk 36
    defaultConfig {
        applicationId 'local.offerin.practice'
        minSdk 26
        targetSdk 36
        versionCode 16
        versionName '0.4.8'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    buildTypes {
        debug {
            buildConfigField 'String', 'DEFAULT_API_KEY', javaString(personalDebugKey)
            buildConfigField 'String', 'DEFAULT_BASE_URL', javaString(personalDebugKey ? 'https://api.deepseek.com' : '')
            buildConfigField 'String', 'DEFAULT_MODEL', javaString(personalDebugKey ? 'deepseek-flash' : '')
            buildConfigField 'String', 'DEFAULT_PROFILE_ID', javaString(personalDebugKey ? 'personal-deepseek-flash-v1' : '')
        }
        release {
            minifyEnabled false
            buildConfigField 'String', 'DEFAULT_API_KEY', '""'
            buildConfigField 'String', 'DEFAULT_BASE_URL', '""'
            buildConfigField 'String', 'DEFAULT_MODEL', '""'
            buildConfigField 'String', 'DEFAULT_PROFILE_ID', '""'
        }
    }
    testOptions { unitTests.all { workingDir rootProject.projectDir.parentFile } }
}
dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // ZXing 4.3.0's published POM omits these runtime implementation dependencies.
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.fragment:fragment:1.8.6'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:inline-parser:4.6.2'
    implementation 'io.noties.markwon:ext-latex:4.6.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
